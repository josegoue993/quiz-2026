<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quiz du soir</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quiz du soir">
<meta name="theme-color" content="#fbf5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
[hidden]{display:none!important}
/* Une colonne pour le pouce : accueil en tuiles, exercice plein écran avec action fixe en bas */
:root{
  --bg:#fbf5f3; --surface:#ffffff; --sunk:#f3e7e3; --ink:#3a1f1a; --muted:#7a5d57; --line:#ecd8d2;
  --lagoon:#c4462f; --lagoon-ink:#ffffff; --lagoon-soft:#fde4dd;
  --ok:#23804a; --ok-soft:#dff2e6; --ko:#a0244a; --ko-soft:#f9e0e7; --warn:#a85d12; --warn-soft:#f6e7d4;
  --dp:#2b5a8a; --nc:#0f7c7a; --ps:#6a5aa8; --pa:#a0522d; --en:#a3364b; --mes:#8a6d12; --car:#3d6b2f;
  --font:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --round:-apple-system,"SF Pro Rounded",ui-rounded,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1311; --surface:#271a17; --sunk:#31221e; --ink:#f6e8e4; --muted:#bfa29b; --line:#43302b;
  --lagoon:#ff8f78; --lagoon-ink:#2a100b; --lagoon-soft:#4a241c;
  --ok:#66c58b; --ok-soft:#163222; --ko:#f2839d; --ko-soft:#3d1a24; --warn:#e3a05e; --warn-soft:#3a2814;
  --dp:#80b2e2; --nc:#46bdb8; --ps:#ad9fe8; --pa:#e39b72; --en:#ec8aa0; --mes:#e2c56b; --car:#9fd18a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1311; --surface:#271a17; --sunk:#31221e; --ink:#f6e8e4; --muted:#bfa29b; --line:#43302b;
  --lagoon:#ff8f78; --lagoon-ink:#2a100b; --lagoon-soft:#4a241c;
  --ok:#66c58b; --ok-soft:#163222; --ko:#f2839d; --ko-soft:#3d1a24; --warn:#e3a05e; --warn-soft:#3a2814;
  --dp:#80b2e2; --nc:#46bdb8; --ps:#ad9fe8; --pa:#e39b72; --en:#ec8aa0; --mes:#e2c56b; --car:#9fd18a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font);-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit}
.view{max-width:620px;margin:0 auto;padding-block:16px 150px;display:flex;flex-direction:column;gap:16px}
h1{font:700 1.9rem/1.1 var(--round);margin:4px 0 0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
.label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.stat b{display:block;font:700 1.45rem/1.1 var(--round);font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.ring{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:6px}
.ring i{display:block;height:100%;background:var(--lagoon);border-radius:6px}
.hero{background:var(--lagoon);color:var(--lagoon-ink);border:0}
.hero h2{font:700 1.4rem/1.2 var(--round);margin:0}
.hero p{margin:0;opacity:.9}
.hero .label{color:var(--lagoon-ink);opacity:.75}
.tile.wide>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:650;cursor:pointer;min-height:50px;width:100%}
.btn.main{background:var(--lagoon);color:var(--lagoon-ink)}
.hero .btn.main{background:var(--lagoon-ink);color:var(--lagoon)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.ko{background:var(--warn-soft);color:var(--warn)}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .dot{width:10px;height:10px;border-radius:50%}
.tile b{font:650 1rem/1.25 var(--round)}
.tile small{color:var(--muted);font-size:.78rem}
.tile .bar{height:5px;background:var(--sunk);border-radius:5px;overflow:hidden}
.tile .bar i{display:block;height:100%}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:8px}
.x{border:0;background:var(--sunk);border-radius:12px;width:40px;height:40px;font-size:1.1rem;cursor:pointer;flex:0 0 auto}
.prog{flex:1;height:8px;background:var(--sunk);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--lagoon);transition:width .25s}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;min-width:3.5em;text-align:right}
.q{font:650 1.28rem/1.32 var(--round);margin:0;text-wrap:pretty}
.tag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;line-height:1.4}
.opt .k{flex:0 0 28px;height:28px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt.good{border-color:var(--ok);background:var(--ok-soft)} .opt.good .k{background:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--ko);background:var(--ko-soft)} .opt.bad .k{background:var(--ko);color:var(--surface)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.verdict{font:700 1.05rem var(--round)}
.verdict.good{color:var(--ok)} .verdict.bad{color:var(--ko)}
.ex{background:var(--sunk);border-radius:14px;padding:12px 14px;margin:0}
.answer{border-left:4px solid var(--lagoon);background:var(--lagoon-soft);border-radius:4px 14px 14px 4px;padding:12px 14px;margin:0}
.hint{color:var(--muted);font-size:.9rem;margin:0}
.timer{font:700 2rem var(--round);font-variant-numeric:tabular-nums;text-align:center;color:var(--lagoon)}
.step{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.step.done{background:transparent}
.step .h{display:flex;gap:10px;align-items:baseline}
.letter{flex:0 0 auto;min-width:30px;text-align:center;font:800 .85rem/1.6 var(--round);border-radius:8px;padding:0 7px;color:var(--surface)}
.step .gq{font-weight:650}
.step.done .gq{font-weight:500;color:var(--muted)}
.step .ra{margin:0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:3;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:18px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.dock .in{max-width:620px;margin:0 auto;display:flex;gap:10px}
.score{font:800 3rem/1 var(--round);color:var(--lagoon);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}
.miss{border-left:4px solid var(--ko);padding:4px 0 4px 12px}
.miss p{margin:0}
input[type=password]{font:inherit;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.foot{text-align:center;color:var(--muted);font-size:.8rem}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:11px var(--font)}
.chart .ln{fill:none;stroke:var(--lagoon);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--lagoon-soft)}
.chart .pt{fill:var(--lagoon);stroke:var(--surface);stroke-width:2}
.chart .bar{fill:var(--lagoon)}
.chart .bar.sel,.chart .pt.sel{fill:var(--ink)}
.chart .hit{fill:transparent;cursor:pointer}
.readout{font-size:.9rem;color:var(--muted);margin:0;min-height:1.4em}
.readout b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface)}
.stack i{display:block;height:100%}
.trow{display:flex;flex-direction:column;gap:5px}
.trow .tl{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.trow .tl span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.big{font:800 2.2rem/1 var(--round);font-variant-numeric:tabular-nums}

.news{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.news:last-child{border-bottom:0;padding-bottom:0}
.news h3{font:650 1.05rem/1.3 var(--round);margin:0}
.news p{margin:0}
.oralnote{color:var(--ok);font-size:.93rem}
.src{font-size:.82rem;color:var(--muted);margin:0;overflow-wrap:anywhere}
.src a{color:var(--muted)}
.archive{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--lagoon);color:var(--lagoon-ink);border-color:var(--lagoon)}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
.mic{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.mic .row{display:flex;align-items:center;gap:12px}
.mic .clock{font:700 2rem/1 var(--round);font-variant-numeric:tabular-nums;color:var(--lagoon);min-width:4.2ch}
.mic .clock.over{color:var(--warn)}
.mic .goal{font-size:.82rem;color:var(--muted);flex:1}
.mic .gbar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.mic .gbar i{display:block;height:100%;width:0;background:var(--lagoon);transition:width 1s linear}
.mic .gbar.over i{background:var(--warn)}
.recbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;min-height:50px;padding:0 16px;font-weight:650;cursor:pointer;background:var(--ko-soft);color:var(--ko);flex:1}
.recbtn .rd{width:12px;height:12px;border-radius:50%;background:var(--ko)}
.recbtn.on .rd{border-radius:3px;animation:pulse 1s infinite}
.recbtn:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
@keyframes pulse{50%{opacity:.35}}
.mic audio{width:100%}
.mic .note{font-size:.82rem;color:var(--muted);margin:0}
.btn.mid{background:var(--sunk);color:var(--ink)}
.evalrow{display:flex;gap:8px;width:100%}
.evalrow .btn{padding:12px 8px}
@media (prefers-reduced-motion:reduce){.recbtn.on .rd{animation:none}.mic .gbar i{transition:none}}
.partbox{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.partbox .ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ptime{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}.ptime.over{color:var(--warn);font-weight:700}
.pkw{white-space:pre-line;margin:0;font-size:.92rem;background:var(--sunk);border-radius:12px;padding:10px 12px}
.src2{font-size:.85rem;color:var(--muted);margin:0;font-style:italic}
.texte{border-left:4px solid var(--line);padding:2px 0 2px 14px;margin:0;display:flex;flex-direction:column;gap:8px;font-family:Georgia,"Times New Roman",serif;font-size:1.02rem;line-height:1.55}
.texte p{margin:0}
details.card>summary{cursor:pointer;font-weight:650;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:" ▾";color:var(--muted)}
details.card[open]>summary::after{content:" ▴"}
.stepc{display:flex;flex-direction:column;gap:6px}
.stepc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.stepc li{font-size:.95rem}
textarea{font:inherit;font-size:.95rem;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-height:120px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.cs h4{margin:6px 0 0;font:700 .95rem var(--round)}
.cs p{margin:0}
.cs .pl{font-weight:700;color:var(--lagoon)}
.qa{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface);text-align:left;cursor:pointer}
.qa .r{color:var(--ok)}
.pick{display:flex;flex-direction:column;gap:8px}
.pick button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.pick small{color:var(--muted);flex:0 0 auto}
.grid4{display:flex;flex-direction:column;gap:10px}
.crit{display:flex;flex-direction:column;gap:6px}
.crit .sc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.crit .sc button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:40px;font-weight:700;cursor:pointer}
.crit .sc button[aria-pressed="true"]{background:var(--lagoon);color:var(--lagoon-ink);border-color:var(--lagoon)}
.tics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tics button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tics b{font:800 1.3rem var(--round);font-variant-numeric:tabular-nums}
table.sp{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
table.sp td,table.sp th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.sp td:not(:first-child),table.sp th:not(:first-child){text-align:right}
table.sp .over{color:var(--warn);font-weight:700}
.hist{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.hist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days .chip{flex:0 0 auto}
.days .chip.today{border-color:var(--lagoon);border-width:2px}
.dtitle{font:700 1.3rem/1.25 var(--round);margin:0}
.tagc{font-size:.78rem;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.card.film{background:var(--warn-soft);border-color:var(--warn)}
.card.film b{color:var(--warn);font:800 1.05rem var(--round)}
.card.film p{margin:0}
.card.audio b{font:700 1rem var(--round)}
.chk{display:flex;align-items:flex-start;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.chk:last-of-type{border-bottom:0}
.chk .box{flex:0 0 28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-weight:800;color:var(--lagoon-ink);cursor:pointer}
.chk .box[aria-checked="true"]{background:var(--lagoon);border-color:var(--lagoon)}
.chk span{flex:1;line-height:1.4;padding-top:2px}
.chk.ok span{color:var(--muted);text-decoration:line-through}
.chk .go{flex:0 0 auto;border:0;background:var(--lagoon-soft);color:var(--lagoon);font-weight:700;border-radius:10px;padding:6px 10px;cursor:pointer}
.chk .box:focus-visible,.chk .go:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
.card.next{border-color:var(--lagoon);border-width:2px}
.card.next p{margin:0}
.card.jose .stepc{border-top:1px solid var(--line);padding-top:8px}
.card.jose p{margin:0}
.prog-tile{border-color:var(--lagoon);border-width:2px}
.card.cd{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 12px}.card.cd .label{width:100%}.card.cd .hint{width:100%}
.arrive{width:100%;margin:0;color:var(--ko);font-size:.95rem}.arrive b{font:800 1.08rem var(--round)}
.glist{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-weight:600}
.rhpart>summary{font:700 1.02rem var(--round)}
.rhb{border-top:1px solid var(--line);padding-top:10px}
.rhb p{margin:0}
.rhb ul,.rhb ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.rhb.key,.card.key{background:var(--lagoon-soft);border-color:var(--lagoon)}
.rhtab{display:flex;flex-direction:column;gap:8px}
.rhrow{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--lagoon);padding-left:10px}
.rhrow b{font-size:.92rem}
.rhrow span{font-size:.95rem}
.chrono{margin:0;font-weight:650;line-height:1.5}
.chip.light{background:transparent;color:var(--lagoon-ink);border-color:var(--lagoon-ink)}
.hero .btn.main{margin-top:2px}
.rh-tile{border-color:var(--lagoon)}
.breath{display:flex;flex-direction:column;align-items:center;gap:12px}
.bcirc{width:150px;height:150px;border-radius:50%;background:var(--lagoon-soft);border:3px solid var(--lagoon);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transform:scale(.72);transition:transform 2s ease-in-out}
.bcirc.in,.bcirc.hold{transform:scale(1)}
.bcirc.out,.bcirc.hold2{transform:scale(.72)}
.blab{font:800 1.3rem var(--round);color:var(--lagoon)}
.bcnt{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.breath .seg{justify-content:center}
@media (prefers-reduced-motion:reduce){.bcirc{transition:none}}
.listen{align-self:flex-start;border:1px solid var(--lagoon);background:var(--surface);color:var(--lagoon);font-weight:700;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.9rem}
.listen:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
.hero .listen{background:transparent;color:var(--lagoon-ink);border-color:var(--lagoon-ink)}
#ttsbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 8px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
#ttsbar .tb{border:0;background:transparent;color:var(--bg);min-width:40px;height:40px;border-radius:50%;font-weight:800;cursor:pointer;font-size:1rem}
#ttsbar .tb:focus-visible{outline:2px solid var(--bg)}
#ttsbar .ti{font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 4px}
#ttshelp{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:6;background:var(--surface);border:2px solid var(--lagoon);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:560px;margin:0 auto}
#ttshelp p{margin:0;font-size:.95rem}
.texte.pausetxt{display:block}
.pausetxt .pz{color:var(--lagoon);font-weight:800}
.pausetxt .pz2{color:var(--ko)}
.jm summary{display:flex;flex-direction:column;gap:2px}
.jrole{font:500 .85rem var(--font);color:var(--muted)}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.qa .r{white-space:pre-line}
.card.menu{gap:0;padding:6px 6px 8px}
.mtitle{font:700 1.02rem var(--round);padding:10px 10px 6px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 10px 12px 14px;cursor:pointer;position:relative;min-height:54px}
.mrow::before{content:"";position:absolute;left:2px;top:14px;bottom:14px;width:4px;border-radius:4px;background:var(--c,var(--line))}
.mrow>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.mrow b{font:650 1rem/1.25 var(--round)}
.mrow small{color:var(--muted);font-size:.8rem}
.mbadge{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;flex:0 0 auto}
.mrow:focus-visible{outline:3px solid var(--lagoon);outline-offset:-3px;border-radius:12px}
.card.quote{gap:6px;border-left:4px solid var(--lagoon)}
.quote .qt{margin:0;font:italic 600 1.08rem/1.4 Georgia,serif}
.quote .qa2{margin:0;font-size:.82rem;color:var(--muted)}
.quote .qx{margin:0;font-size:.95rem}
</style>

</section>

const CAT = {
  dp:{n:'Droit public',col:'var(--dp)',k:'QCM'}, nc:{n:'Nouvelle-Calédonie',col:'var(--nc)',k:'QCM'}, ps:{n:'Province Sud',col:'var(--ps)',k:'QCM'},
  pa:{n:'Parcours et motivation',col:'var(--pa)',k:'Oral'}, en:{n:'Questions pièges',col:'var(--en)',k:'Oral'},
  mes:{n:'Mises en situation',col:'var(--mes)',k:'CADREA'}, car:{n:'Exemples CAR-T',col:'var(--car)',k:'CAR-T'}
};
const GOAL = 15;
let P = {}, D = {}, H = {}, M = {};
function load(){ try{ P=JSON.parse(localStorage.getItem('qs_p')||'{}')||{}; D=JSON.parse(localStorage.getItem('qs_d')||'{}')||{}; H=JSON.parse(localStorage.getItem('qs_h')||'{}')||{}; M=JSON.parse(localStorage.getItem('qs_m')||'{}')||{}; }catch(e){ P={}; D={}; H={}; M={}; } }
function save(){ try{ localStorage.setItem('qs_p',JSON.stringify(P)); localStorage.setItem('qs_d',JSON.stringify(D)); localStorage.setItem('qs_h',JSON.stringify(H)); localStorage.setItem('qs_m',JSON.stringify(M)); }catch(e){} }
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function streak(){
  let n=0; const d=new Date();
  if(!D[today()]) d.setDate(d.getDate()-1);
  for(;;){ const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(D[k]){n++; d.setDate(d.getDate()-1);} else break; }
  return n;
}
const mastered = it => (P[it.id]?.lv||0) >= 1;
const toReview = it => { const l=P[it.id]?.last; return l==='ko'||l==='mid'; };
function el(tag,cls,txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
function btn(cls,txt,fn){ const b=el('button','btn '+cls,txt); b.type='button'; b.onclick=fn; return b; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function show(id){ ttsStop(); ['v-lock','v-home','v-play','v-stats','v-revue'].forEach(v=>document.getElementById(v).hidden=(v!==id)); window.scrollTo(0,0); }
function dock(...buttons){ const d=document.getElementById('dock'), i=document.getElementById('dockin'); i.replaceChildren(...buttons); d.hidden=!buttons.length; }

/* ---------- choix des questions ---------- */
function pick(pool,k){
  const rank = it => { const p=P[it.id]; if(!p) return [1,Math.random()]; if(p.last==='ko') return [0,p.t]; if(p.last==='mid') return [0.5,p.t]; return [2+(p.lv||0), p.t]; };
  return shuffle(pool).sort((a,b)=>{ const x=rank(a), y=rank(b); return x[0]-y[0] || x[1]-y[1]; }).slice(0,k);
}
const by = c => ITEMS.filter(i=>i.c===c);
function deckFor(mode){
  if(mode==='soir'){
    const qcm = shuffle([].concat(pick(by('dp'),3), pick(by('nc'),3), pick(by('ps'),1)));
    const oral = pick(by(Math.random()<.5?'pa':'en'),1);
    const pas = pick(by(Math.random()<.7?'mes':'car'),1);
    return qcm.concat(oral, pas);
  }
  if(mode==='serie') return pick(ITEMS.filter(i=>i.t==='qcm'),20);
  if(mode==='rev') return shuffle(ITEMS.filter(toReview)).slice(0,15);
  const it=by(mode); return pick(it, it[0].t==='qcm'?10:(it[0].t==='oral'?5:3));
}

/* ---------- accueil ---------- */
function menuRow(title, meta, badge, fn, col, badgeCls){
  const r=el('button','mrow'); r.type='button'; if(col) r.style.setProperty('--c',col);
  const l=el('div'); l.append(el('b',null,title)); if(meta) l.append(el('small',null,meta)); r.append(l);
  const bd=el('span', badgeCls||'mbadge', badge==null?'›':badge); r.append(bd); r.onclick=fn; return r;
}
function menuCard(icon, title, rows){ const c=el('div','card menu'); c.append(el('span','mtitle',icon+' '+title)); rows.filter(Boolean).forEach(x=>c.append(x)); return c; }

  // aujourd'hui

  const nb=(arr)=>arr.filter(e=>P[e.id]&&P[e.id].last==='ok').length;
  const cat=(c,meta)=>{ const its=by(c), mm=its.filter(mastered).length; return menuRow(CAT[c].n, meta||(mm+'/'+its.length+' maîtrisées'), null, ()=>start(c), CAT[c].col); };
  const oral=menuCard('🎙️','M’entraîner à l’oral',[
    menuRow('Ma présentation','5 min · chrono par partie, liseuse', null, startPres, 'var(--lagoon)'),

    menuRow('Sur texte', EXPO.length+' textes · préparation IFAP et corrigé', nb(EXPO)+'/'+EXPO.length, ()=>expoPicker('texte'), 'var(--dp)'),
    menuRow('Sur sujet', SUJ.length+' sujets · corrigés', nb(SUJ)+'/'+SUJ.length, ()=>expoPicker('sujet'), 'var(--nc)')]);

    menuRow('QCM · '+CAT.nc.n, null, null, ()=>start('nc'), CAT.nc.col),

function readable(node){
  const out=[];

    if(n.nodeType===3){ const t=n.nodeValue.replace(/\s+/g,' ').trim(); if(t) out.push(t); return; }
    if(n.nodeType!==1) return;
    if(n.hidden || n.matches('.listen,.src,.foot,audio,svg,.archive,.top,.mic,.seg,.days,.tagc,.go,.box') ) return;
    if(n.tagName==='BUTTON' && !n.classList.contains('qa')) return;
    if(n.tagName==='DETAILS' && !n.open){ const s=n.querySelector('summary'); if(s) out.push(s.textContent.trim()+'.'); return; }
    n.childNodes.forEach(walk);
    if(/^(P|H1|H2|H3|H4|LI|DIV|SUMMARY|B|SPAN)$/.test(n.tagName)) out.push('\n');

}

function pauseView(){
  stopRec(); const v=document.getElementById('v-play'); v.replaceChildren(); show('v-play'); scrollTo(0,0); dock();
  const t=el('div','top'); const x=el('button','x','✕'); x.type='button'; x.setAttribute('aria-label','Retour à Rhetorik'); x.onclick=rhView; t.append(x, el('b',null,'Le pouvoir de la pause')); v.append(t);
  v.append(el('h1',null,'Le pouvoir de la pause'), el('p','sub','Exercice Rhetorik · travailler le débit et la maîtrise du rythme'));
  v.append(el('p','hint','Sous le trac, on parle trop vite sans s’en rendre compte. Lis deux fois le même paragraphe de ta présentation : d’abord normalement, puis avec des pauses volontaires. Compare ensuite.'));
  const PARAS=RH.pause.paras||[{t:'Extrait',p:RH.pause.para}]; let PI=(window.__pauseIdx||0)%PARAS.length;
  const chooser=el('div','seg'); PARAS.forEach((x,k)=>{ const c=el('button','chip',x.t); c.type='button'; c.setAttribute('aria-pressed',k===PI); c.onclick=()=>{ if(REC) return; window.__pauseIdx=k; pauseView(); }; chooser.append(c); });
  v.append(el('span','label','Choisis ton extrait'), chooser);
  const P=PARAS[PI].p; const R={};
  function ressenti(k){
    const c=el('div','stepc'); c.append(el('b',null,'Ton ressenti'));
    const seg=el('div','seg'); const opts=k===1?['Essoufflée','Impression de réciter','Manque de respiration','Ça allait']:['Je respire mieux','Je maîtrise mon rythme','Je suis plus claire','Pas de différence'];
    R[k]=R[k]||{f:[],c:0};
    opts.forEach(o=>{ const b=el('button','chip',o); b.type='button'; b.setAttribute('aria-pressed','false'); b.onclick=()=>{ const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); R[k].f=on?R[k].f.concat(o):R[k].f.filter(z=>z!==o); }; seg.append(b); });
    c.append(seg, el('b',null,'Clarté perçue (1 à 5)'));
    const sc=el('div','crit'); const row=el('div','sc'); row.style.gridTemplateColumns='repeat(5,1fr)';
    for(let n=1;n<=5;n++){ const b=el('button',null,String(n)); b.type='button'; b.setAttribute('aria-pressed','false'); b.setAttribute('aria-label','Clarté '+n); b.onclick=()=>{ R[k].c=n; row.querySelectorAll('button').forEach(z=>z.setAttribute('aria-pressed',z===b)); }; row.append(b); }
    sc.append(row); c.append(sc); return c;
  }
  // étape 1
  const s1=el('div','card'); s1.append(el('span','label','Étape 1 · Lecture sans pause'), el('p','hint','Lis le paragraphe à voix haute, normalement, sans marquer volontairement de pause.'), el('p','texte pausetxt',P)); v.append(s1);
  speak(s1, 60, '1 min', {goal:'Lance, lis, puis arrête : le temps est noté.', onstop:(tot)=>{ R.t1=tot; }});
  s1.append(ressenti(1));
  // étape 2
  const s2=el('div','card'); s2.append(el('span','label','Étape 2 · Lecture avec pauses volontaires'), el('p','hint','Même paragraphe : arrêt net d’environ 1 seconde à chaque virgule (‖), et d’environ 2 secondes à chaque point (‖‖).'));
  const marked=el('p','texte pausetxt'); P.split(/([,.:;])/).forEach(seg=>{ if(seg===','||seg===';'||seg===':'){ marked.append(seg); marked.append(el('span','pz',' ‖ ')); } else if(seg==='.'){ marked.append(seg); marked.append(el('span','pz pz2',' ‖‖ ')); } else marked.append(seg); });
  s2.append(marked); v.append(s2);
  speak(s2, 90, '1 min 30', {goal:'Lance, lis avec les pauses, puis arrête.', onstop:(tot)=>{ R.t2=tot; }});
  s2.append(ressenti(2));
  // étape 3
  const s3=el('div','card'); s3.append(el('span','label','Étape 3 · Comparaison')); const out=el('div'); s3.append(out);
  s3.append(btn('main','Comparer et enregistrer',()=>{
    out.replaceChildren();
    const tb=el('table','sp'); const h=el('tr'); ['','Sans pause','Avec pauses'].forEach(z=>h.append(el('th',null,z))); tb.append(h);
    [['Temps',R.t1!=null?fmt0(R.t1):'—',R.t2!=null?fmt0(R.t2):'—'],['Clarté',R[1]&&R[1].c?R[1].c+'/5':'—',R[2]&&R[2].c?R[2].c+'/5':'—'],['Ressenti',(R[1]&&R[1].f.join(', '))||'—',(R[2]&&R[2].f.join(', '))||'—']].forEach(r=>{ const tr=el('tr'); r.forEach((z,i)=>tr.append(el(i?'td':'th',null,z))); tb.append(tr); });
    out.append(tb);
    if(R.t1!=null&&R.t2!=null) out.append(el('p','hint', R.t2>R.t1 ? 'Avec les pauses : +'+(R.t2-R.t1)+' s. C’est normal, et c’est l’effet recherché : plus long, mais plus clair et plus maîtrisé.' : 'Tu n’as pas ralenti avec les pauses : le trac prend peut-être le dessus. Refais l’exercice une 2e fois, ça suffit souvent à corriger.'));
    const ul=el('ul'); RH.pause.observe.forEach(o=>ul.append(el('li',null,o))); out.append(el('b',null,'Ce que le coach observe'), ul);
    try{ const H=JSON.parse(localStorage.getItem('qs_pause')||'[]'); H.push({d:new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}),x:PI+1,t1:R.t1,t2:R.t2,c1:R[1]&&R[1].c,c2:R[2]&&R[2].c}); localStorage.setItem('qs_pause',JSON.stringify(H.slice(-30))); }catch(e){}
    out.scrollIntoView({behavior:'smooth',block:'nearest'});
  }));
  v.append(s3);
  try{ const H=JSON.parse(localStorage.getItem('qs_pause')||'[]'); if(H.length){ const hc=el('details','card'); hc.append(el('summary',null,'Mes essais précédents ('+H.length+')')); const hl=el('div','hist'); H.slice(-8).reverse().forEach(z=>{ const d=el('div'); d.append(el('span',null,z.d+(z.x?' · extrait '+z.x:'')), el('span',null,(z.t1!=null?fmt0(z.t1):'—')+' → '+(z.t2!=null?fmt0(z.t2):'—')+(z.c1&&z.c2?' · clarté '+z.c1+' → '+z.c2:''))); hl.append(d); }); hc.append(hl); v.append(hc); } }catch(e){}
  dock(btn('soft','Retour à Rhetorik',rhView));
}

function qcm(v,it){
  const opts=shuffle([{t:it.ok,ok:true}].concat(it.ko.map(t=>({t,ok:false}))));

  opts.forEach((o,k)=>{ const b=el('button','opt'); b.type='button'; b.append(el('span','k','ABCD'[k]), el('span',null,o.t)); b.onclick=()=>choose(o,b); bs.push([b,o]); box.append(b); });

  const hd=el('div'); hd.append(el('h1',null,'Revue du jour'), el('p','sub', R? longDate(R.date) : 'Pas encore de revue'));
  v.append(hd);
  if(R){ const txt=[R.titre||'Revue du jour'].concat((R.items||[]).map(n=>n.titre+'.\n'+n.texte+(n.oral?'\nPour l’oral : '+n.oral:''))).concat(R.question?['La question du jour.\n'+R.question.q+'\nRéponse type.\n'+R.question.r]:[]).join('\n'); v.append(listenBtn('Écouter la revue',txt)); }
  if(!R){ v.append(el('p','hint','La revue arrive chaque matin vers 6 h 30. Ouvre l’appli avec internet pour la recevoir.')); return; }
  try{ if(d===ix[0]) localStorage.setItem('qs_revue_seen',d); }catch(e){}
  const c=el('div','card');
  (R.items||[]).forEach(n=>{ const a=el('div','news'); a.append(el('h3',null,n.titre), el('p',null,n.texte)); if(n.oral) a.append(el('p','oralnote','Pour l’oral : '+n.oral)); c.append(a); });
  if(!(R.items||[]).length) c.append(el('p','hint', R.note||'Pas d’actualité marquante aujourd’hui.'));
  v.append(c);
  if(R.question){
    const qc=el('div','card'); qc.append(el('span','label','La question du jour'), el('p','q',R.question.q), el('p','hint','Réponds à voix haute en 1 minute, puis affiche la réponse type.'));
    const b=btn('main','Voir la réponse type',()=>{ b.replaceWith(el('p','answer',R.question.r)); }); qc.append(b); v.append(qc);
  }
  if((R.sources||[]).length){ const sc=el('div','card'); sc.append(el('span','label','Sources'));
    R.sources.forEach(x=>{ const p=el('p','src'); const a=el('a',null,(x.titre||x.url)); a.href=x.url; a.target='_blank'; a.rel='noopener'; p.append(a, ' · '+[x.media,x.date].filter(Boolean).join(', ')); sc.append(p); }); v.append(sc); }
  if(ix.length>1){ const ac=el('div','card'); ac.append(el('span','label','Revues précédentes')); const ar=el('div','archive');
    ix.slice(0,30).forEach(k=>{ const ch=el('button','chip',short(k)); ch.type='button'; ch.setAttribute('aria-pressed', k===d?'true':'false'); ch.onclick=()=>revue(k); ar.append(ch); }); ac.append(ar); v.append(ac); }
  window.scrollTo(0,0);
}

/* ---------- suivi ---------- */
const NS='http://www.w3.org/2000/svg';
function sv(tag,attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
function lastDays(n){ const out=[]; const d=new Date(); d.setDate(d.getDate()-(n-1)); for(let i=0;i<n;i++){ out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')); d.setDate(d.getDate()+1);} return out; }
const short = k => { const [y,m,d]=k.split('-'); return d+'/'+m; };
/* Un graphique simple : barres ou ligne, une seule série, une seule échelle. Toucher un point affiche sa valeur. */
function chart(kind, keys, vals, max, fmt, readout){
  const W=340,Hh=150,L=30,R=8,T=10,B=24, w=W-L-R, h=Hh-T-B;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${Hh}`,class:'chart',role:'img'});
  const ticks=[0,max/2,max];
  ticks.forEach(t=>{ const y=T+h-h*t/max; svg.append(sv('line',{x1:L,x2:W-R,y1:y,y2:y,class:'grid'})); const tx=sv('text',{x:L-6,y:y+4,'text-anchor':'end',class:'ax'}); tx.textContent=fmt(t,true); svg.append(tx); });
  const n=keys.length, step=w/n;
  keys.forEach((k,i)=>{ if((n-1-i)%Math.ceil(n/7)===0){ const tx=sv('text',{x:L+step*i+step/2,y:Hh-6,'text-anchor':'middle',class:'ax'}); tx.textContent=short(k); svg.append(tx);} });
  const marks=[];
  if(kind==='bar'){
    keys.forEach((k,i)=>{ const v=vals[i]||0; const bh=Math.max(v?3:0,h*v/max); const bw=Math.min(18,step-4);
      const r=sv('rect',{x:L+step*i+(step-bw)/2,y:T+h-bh,width:bw,height:bh,rx:3,class:'bar'}); svg.append(r); marks.push(r); });
  } else {
    const pts=keys.map((k,i)=>vals[i]==null?null:[L+step*i+step/2, T+h-h*vals[i]/max]);
    const seq=pts.filter(Boolean);
    if(seq.length>1){ svg.append(sv('path',{d:'M'+seq.map(p=>p.join(',')).join(' L')+` L${seq[seq.length-1][0]},${T+h} L${seq[0][0]},${T+h} Z`,class:'ar'})); svg.append(sv('path',{d:'M'+seq.map(p=>p.join(',')).join(' L'),class:'ln'})); }
    pts.forEach(p=>{ if(!p){marks.push(null);return;} const c=sv('circle',{cx:p[0],cy:p[1],r:4.5,class:'pt'}); svg.append(c); marks.push(c); });
  }
  keys.forEach((k,i)=>{ const hit=sv('rect',{x:L+step*i,y:T,width:step,height:h,class:'hit'});
    hit.addEventListener('click',()=>{ marks.forEach(m=>m&&m.classList.remove('sel')); if(marks[i]) marks[i].classList.add('sel');
      readout.innerHTML=''; const b=document.createElement('b'); b.textContent=short(k)+' : '; readout.append(b, vals[i]==null?'aucun exercice':fmt(vals[i])); });
    svg.append(hit); });
  return svg;
}
function stats(){
  dock(btn('soft','Retour à l’accueil',home));
  const v=document.getElementById('v-stats'); v.replaceChildren();
  const hd=el('div'); hd.append(el('h1',null,'Mon suivi'), el('p','sub','Ton évolution sur les 14 derniers jours'));
  const keys=lastDays(14);
  const totN=Object.values(H).reduce((a,h)=>a+h.qn,0), totOk=Object.values(H).reduce((a,h)=>a+h.qok,0);
  const m=ITEMS.filter(mastered).length;
  const tops=el('div','stats');
  const a=el('div','stat'); a.append(el('b',null, totN? Math.round(100*totOk/totN)+' %':'–'), el('span',null,'réussite QCM'));
  const b=el('div','stat'); b.append(el('b',null, String(Object.values(D).reduce((x,y)=>x+y,0))), el('span',null,'exercices faits'));
  const c=el('div','stat'); c.append(el('b',null, Math.round(100*m/ITEMS.length)+' %'), el('span',null,'maîtrisé'));
  tops.append(a,b,c);
  // 1. réussite
  const c1=el('div','card'); const r1=el('p','readout','Touche un jour pour voir le détail.');
  const rate=keys.map(k=>H[k]&&H[k].qn? Math.round(100*H[k].qok/H[k].qn):null);
  c1.append(el('span','label','Taux de réussite aux QCM, par jour'), chart('line',keys,rate,100,(x,ax)=>Math.round(x)+(ax?'':' % de bonnes réponses'),r1), r1);
  // 2. maîtrise cumulée
  const c2=el('div','card'); const r2=el('p','readout','Touche un jour pour voir le détail.');
  let last=null; const mv=keys.map(k=>{ if(M[k]!=null) last=M[k]; return last; });
  const mmax=Math.max(10, ...mv.filter(x=>x!=null)); const top=Math.ceil(mmax/10)*10;
  c2.append(el('span','label','Questions maîtrisées (cumul)'), chart('line',keys,mv,top,(x,ax)=>Math.round(x)+(ax?'':' questions maîtrisées'),r2), r2);
  // 3. activité
  const c3=el('div','card'); const r3=el('p','readout','Touche un jour pour voir le détail.');
  const act=keys.map(k=>D[k]||0); const amax=Math.max(GOAL,...act); const atop=Math.ceil(amax/5)*5;
  c3.append(el('span','label','Exercices faits par jour (objectif : '+GOAL+')'), chart('bar',keys,act,atop,(x,ax)=>Math.round(x)+(ax?'':' exercices'),r3), r3);
  // 4. par thème
  const c4=el('div','card'); c4.append(el('span','label','Où j’en suis, par thème'));
  const COLS=[['Maîtrisé','var(--ok)'],['En cours','var(--lagoon)'],['À revoir','var(--warn)'],['Pas encore vu','var(--sunk)']];
  const lg=el('div','legend'); COLS.forEach(([n,col])=>{ const sp=el('span'); const i=el('i'); i.style.background=col; sp.append(i,n); lg.append(sp); }); c4.append(lg);
  const rows=Object.entries(CAT).map(([k,o])=>{ const its=by(k); const ma=its.filter(mastered).length, rv=its.filter(toReview).length, nv=its.filter(i=>!P[i.id]).length; return {k,o,n:its.length,parts:[ma,its.length-ma-rv-nv,rv,nv],pct:ma/its.length}; });
  rows.forEach(r=>{ const tr=el('div','trow'); const tl=el('div','tl'); tl.append(el('span',null,r.o.n), el('span',null,Math.round(100*r.pct)+' % maîtrisé'));
    const st=el('div','stack'); r.parts.forEach((p,i)=>{ if(!p) return; const x=el('i'); x.style.flex=String(p); x.style.background=COLS[i][1]; x.title=COLS[i][0]+' : '+p; st.append(x); });
    tr.append(tl,st); c4.append(tr); });
  // 5. points faibles
  const c5=el('div','card'); c5.append(el('span','label','À travailler en priorité'));
  const weak=rows.filter(r=>r.parts[2]>0).sort((a,b)=>b.parts[2]/b.n-a.parts[2]/a.n).slice(0,3);
  if(weak.length) weak.forEach(r=>{ const p=el('p',null); p.style.margin='0'; const bb=el('b',null,r.o.n); p.append(bb,' : '+r.parts[2]+' question'+(r.parts[2]>1?'s':'')+' à revoir'); c5.append(p); });
  else c5.append(el('p','hint','Rien à signaler pour le moment. Continue les séances : les thèmes à travailler apparaîtront ici.'));
  if(weak.length) c5.append(btn('main','Revoir mes erreurs',()=>start('rev')));
  v.append(hd,tops,c1,c2,c3,c4,c5);
  show('v-stats');
}

/* ---------- déverrouillage ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(ENC.salt), iterations:250000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function openWith(key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, b64(ENC.ct));
  { const DAT=JSON.parse(new TextDecoder().decode(pt)); ITEMS=Array.isArray(DAT)?DAT:DAT.items; EXPO=DAT.expo||[]; SUJ=DAT.sujets||[]; PRES=DAT.pres||{}; PLAN=DAT.plan||[]; RH=DAT.rhetorik||null; JURY=DAT.jury||null; } load(); home();
}
document.getElementById('lockform').addEventListener('submit', async ev=>{
  ev.preventDefault(); const msg=document.getElementById('lockmsg'); msg.textContent='Vérification…';
  try{ const key=await deriveKey(document.getElementById('pw').value.trim()); await openWith(key);
       try{ const raw=await crypto.subtle.exportKey('raw',key); localStorage.setItem('quizKey', btoa(String.fromCharCode(...new Uint8Array(raw)))); }catch(e){} }
  catch(e){ msg.textContent='Mot de passe incorrect. Vérifie les tirets et les minuscules.'; }
});
(async()=>{ try{ const k=localStorage.getItem('quizKey'); if(!k) return; const key=await crypto.subtle.importKey('raw', b64(k), {name:'AES-GCM'}, false, ['decrypt']); await openWith(key); }
  catch(e){ try{localStorage.removeItem('quizKey')}catch(_){} } })();
if('serviceWorker' in navigator){ window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
