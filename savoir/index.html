<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mes connaissances</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Savoir">
<meta name="theme-color" content="#fbf5f3" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1c1311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>
[hidden]{display:none!important}
/* Une colonne pour le pouce : accueil en tuiles, exercice plein écran avec action fixe en bas */
:root{
  --bg:#fbf5f3; --surface:#ffffff; --sunk:#f3e7e3; --ink:#3a1f1a; --muted:#7a5d57; --line:#ecd8d2;
  --lagoon:#c4462f; --lagoon-ink:#ffffff; --lagoon-soft:#fde4dd;
  --ok:#23804a; --ok-soft:#dff2e6; --ko:#a0244a; --ko-soft:#f9e0e7; --warn:#a85d12; --warn-soft:#f6e7d4;
  --dp:#2b5a8a; --nc:#0f7c7a; --ps:#6a5aa8; --pa:#a0522d; --en:#a3364b; --mes:#8a6d12; --car:#3d6b2f;
  --font:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --round:-apple-system,"SF Pro Rounded",ui-rounded,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1311; --surface:#271a17; --sunk:#31221e; --ink:#f6e8e4; --muted:#bfa29b; --line:#43302b;
  --lagoon:#ff8f78; --lagoon-ink:#2a100b; --lagoon-soft:#4a241c;
  --ok:#66c58b; --ok-soft:#163222; --ko:#f2839d; --ko-soft:#3d1a24; --warn:#e3a05e; --warn-soft:#3a2814;
  --dp:#80b2e2; --nc:#46bdb8; --ps:#ad9fe8; --pa:#e39b72; --en:#ec8aa0; --mes:#e2c56b; --car:#9fd18a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1311; --surface:#271a17; --sunk:#31221e; --ink:#f6e8e4; --muted:#bfa29b; --line:#43302b;
  --lagoon:#ff8f78; --lagoon-ink:#2a100b; --lagoon-soft:#4a241c;
  --ok:#66c58b; --ok-soft:#163222; --ko:#f2839d; --ko-soft:#3d1a24; --warn:#e3a05e; --warn-soft:#3a2814;
  --dp:#80b2e2; --nc:#46bdb8; --ps:#ad9fe8; --pa:#e39b72; --en:#ec8aa0; --mes:#e2c56b; --car:#9fd18a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font);-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit}
.view{max-width:620px;margin:0 auto;padding-block:16px 150px;display:flex;flex-direction:column;gap:16px}
h1{font:700 1.9rem/1.1 var(--round);margin:4px 0 0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
.label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.stat b{display:block;font:700 1.45rem/1.1 var(--round);font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.ring{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:6px}
.ring i{display:block;height:100%;background:var(--lagoon);border-radius:6px}
.hero{background:var(--lagoon);color:var(--lagoon-ink);border:0}
.hero h2{font:700 1.4rem/1.2 var(--round);margin:0}
.hero p{margin:0;opacity:.9}
.hero .label{color:var(--lagoon-ink);opacity:.75}
.tile.wide>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:650;cursor:pointer;min-height:50px;width:100%}
.btn.main{background:var(--lagoon);color:var(--lagoon-ink)}
.hero .btn.main{background:var(--lagoon-ink);color:var(--lagoon)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.ko{background:var(--warn-soft);color:var(--warn)}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .dot{width:10px;height:10px;border-radius:50%}
.tile b{font:650 1rem/1.25 var(--round)}
.tile small{color:var(--muted);font-size:.78rem}
.tile .bar{height:5px;background:var(--sunk);border-radius:5px;overflow:hidden}
.tile .bar i{display:block;height:100%}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:8px}
.x{border:0;background:var(--sunk);border-radius:12px;width:40px;height:40px;font-size:1.1rem;cursor:pointer;flex:0 0 auto}
.prog{flex:1;height:8px;background:var(--sunk);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--lagoon);transition:width .25s}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;min-width:3.5em;text-align:right}
.q{font:650 1.28rem/1.32 var(--round);margin:0;text-wrap:pretty}
.tag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;line-height:1.4}
.opt .k{flex:0 0 28px;height:28px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt.good{border-color:var(--ok);background:var(--ok-soft)} .opt.good .k{background:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--ko);background:var(--ko-soft)} .opt.bad .k{background:var(--ko);color:var(--surface)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.verdict{font:700 1.05rem var(--round)}
.verdict.good{color:var(--ok)} .verdict.bad{color:var(--ko)}
.ex{background:var(--sunk);border-radius:14px;padding:12px 14px;margin:0}
.answer{border-left:4px solid var(--lagoon);background:var(--lagoon-soft);border-radius:4px 14px 14px 4px;padding:12px 14px;margin:0}
.hint{color:var(--muted);font-size:.9rem;margin:0}
.timer{font:700 2rem var(--round);font-variant-numeric:tabular-nums;text-align:center;color:var(--lagoon)}
.step{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.step.done{background:transparent}
.step .h{display:flex;gap:10px;align-items:baseline}
.letter{flex:0 0 auto;min-width:30px;text-align:center;font:800 .85rem/1.6 var(--round);border-radius:8px;padding:0 7px;color:var(--surface)}
.step .gq{font-weight:650}
.step.done .gq{font-weight:500;color:var(--muted)}
.step .ra{margin:0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:3;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:18px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.dock .in{max-width:620px;margin:0 auto;display:flex;gap:10px}
.score{font:800 3rem/1 var(--round);color:var(--lagoon);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}
.miss{border-left:4px solid var(--ko);padding:4px 0 4px 12px}
.miss p{margin:0}
input[type=password]{font:inherit;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.foot{text-align:center;color:var(--muted);font-size:.8rem}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:11px var(--font)}
.chart .ln{fill:none;stroke:var(--lagoon);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--lagoon-soft)}
.chart .pt{fill:var(--lagoon);stroke:var(--surface);stroke-width:2}
.chart .bar{fill:var(--lagoon)}
.chart .bar.sel,.chart .pt.sel{fill:var(--ink)}
.chart .hit{fill:transparent;cursor:pointer}
.readout{font-size:.9rem;color:var(--muted);margin:0;min-height:1.4em}
.readout b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface)}
.stack i{display:block;height:100%}
.trow{display:flex;flex-direction:column;gap:5px}
.trow .tl{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.trow .tl span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.big{font:800 2.2rem/1 var(--round);font-variant-numeric:tabular-nums}

.news{display:flex;flex-direction:column;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.news:last-child{border-bottom:0;padding-bottom:0}
.news h3{font:650 1.05rem/1.3 var(--round);margin:0}
.news p{margin:0}
.oralnote{color:var(--ok);font-size:.93rem}
.src{font-size:.82rem;color:var(--muted);margin:0;overflow-wrap:anywhere}
.src a{color:var(--muted)}
.archive{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--lagoon);color:var(--lagoon-ink);border-color:var(--lagoon)}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
.mic{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.mic .row{display:flex;align-items:center;gap:12px}
.mic .clock{font:700 2rem/1 var(--round);font-variant-numeric:tabular-nums;color:var(--lagoon);min-width:4.2ch}
.mic .clock.over{color:var(--warn)}
.mic .goal{font-size:.82rem;color:var(--muted);flex:1}
.mic .gbar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.mic .gbar i{display:block;height:100%;width:0;background:var(--lagoon);transition:width 1s linear}
.mic .gbar.over i{background:var(--warn)}
.recbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;min-height:50px;padding:0 16px;font-weight:650;cursor:pointer;background:var(--ko-soft);color:var(--ko);flex:1}
.recbtn .rd{width:12px;height:12px;border-radius:50%;background:var(--ko)}
.recbtn.on .rd{border-radius:3px;animation:pulse 1s infinite}
.recbtn:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
@keyframes pulse{50%{opacity:.35}}
.mic audio{width:100%}
.mic .note{font-size:.82rem;color:var(--muted);margin:0}
.btn.mid{background:var(--sunk);color:var(--ink)}
.evalrow{display:flex;gap:8px;width:100%}
.evalrow .btn{padding:12px 8px}
@media (prefers-reduced-motion:reduce){.recbtn.on .rd{animation:none}.mic .gbar i{transition:none}}
.partbox{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.partbox .ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ptime{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}.ptime.over{color:var(--warn);font-weight:700}
.pkw{white-space:pre-line;margin:0;font-size:.92rem;background:var(--sunk);border-radius:12px;padding:10px 12px}
.src2{font-size:.85rem;color:var(--muted);margin:0;font-style:italic}
.texte{border-left:4px solid var(--line);padding:2px 0 2px 14px;margin:0;display:flex;flex-direction:column;gap:8px;font-family:Georgia,"Times New Roman",serif;font-size:1.02rem;line-height:1.55}
.texte p{margin:0}
details.card>summary{cursor:pointer;font-weight:650;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:" ▾";color:var(--muted)}
details.card[open]>summary::after{content:" ▴"}
.stepc{display:flex;flex-direction:column;gap:6px}
.stepc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.stepc li{font-size:.95rem}
textarea{font:inherit;font-size:.95rem;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-height:120px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.cs h4{margin:6px 0 0;font:700 .95rem var(--round)}
.cs p{margin:0}
.cs .pl{font-weight:700;color:var(--lagoon)}
.qa{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface);text-align:left;cursor:pointer}
.qa .r{color:var(--ok)}
.pick{display:flex;flex-direction:column;gap:8px}
.pick button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.pick small{color:var(--muted);flex:0 0 auto}
.grid4{display:flex;flex-direction:column;gap:10px}
.crit{display:flex;flex-direction:column;gap:6px}
.crit .sc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.crit .sc button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:40px;font-weight:700;cursor:pointer}
.crit .sc button[aria-pressed="true"]{background:var(--lagoon);color:var(--lagoon-ink);border-color:var(--lagoon)}
.tics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tics button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tics b{font:800 1.3rem var(--round);font-variant-numeric:tabular-nums}
table.sp{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
table.sp td,table.sp th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
table.sp td:not(:first-child),table.sp th:not(:first-child){text-align:right}
table.sp .over{color:var(--warn);font-weight:700}
.hist{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.hist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days .chip{flex:0 0 auto}
.days .chip.today{border-color:var(--lagoon);border-width:2px}
.dtitle{font:700 1.3rem/1.25 var(--round);margin:0}
.tagc{font-size:.78rem;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.card.film{background:var(--warn-soft);border-color:var(--warn)}
.card.film b{color:var(--warn);font:800 1.05rem var(--round)}
.card.film p{margin:0}
.card.audio b{font:700 1rem var(--round)}
.chk{display:flex;align-items:flex-start;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.chk:last-of-type{border-bottom:0}
.chk .box{flex:0 0 28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-weight:800;color:var(--lagoon-ink);cursor:pointer}
.chk .box[aria-checked="true"]{background:var(--lagoon);border-color:var(--lagoon)}
.chk span{flex:1;line-height:1.4;padding-top:2px}
.chk.ok span{color:var(--muted);text-decoration:line-through}
.chk .go{flex:0 0 auto;border:0;background:var(--lagoon-soft);color:var(--lagoon);font-weight:700;border-radius:10px;padding:6px 10px;cursor:pointer}
.chk .box:focus-visible,.chk .go:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
.card.next{border-color:var(--lagoon);border-width:2px}
.card.next p{margin:0}
.card.jose .stepc{border-top:1px solid var(--line);padding-top:8px}
.card.jose p{margin:0}
.prog-tile{border-color:var(--lagoon);border-width:2px}
.card.cd{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 12px}.card.cd .label{width:100%}.card.cd .hint{width:100%}
.arrive{width:100%;margin:0;color:var(--ko);font-size:.95rem}.arrive b{font:800 1.08rem var(--round)}
.glist{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-weight:600}
.rhpart>summary{font:700 1.02rem var(--round)}
.rhb{border-top:1px solid var(--line);padding-top:10px}
.rhb p{margin:0}
.rhb ul,.rhb ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.rhb.key,.card.key{background:var(--lagoon-soft);border-color:var(--lagoon)}
.rhtab{display:flex;flex-direction:column;gap:8px}
.rhrow{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--lagoon);padding-left:10px}
.rhrow b{font-size:.92rem}
.rhrow span{font-size:.95rem}
.chrono{margin:0;font-weight:650;line-height:1.5}
.chip.light{background:transparent;color:var(--lagoon-ink);border-color:var(--lagoon-ink)}
.hero .btn.main{margin-top:2px}
.rh-tile{border-color:var(--lagoon)}
.breath{display:flex;flex-direction:column;align-items:center;gap:12px}
.bcirc{width:150px;height:150px;border-radius:50%;background:var(--lagoon-soft);border:3px solid var(--lagoon);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transform:scale(.72);transition:transform 2s ease-in-out}
.bcirc.in,.bcirc.hold{transform:scale(1)}
.bcirc.out,.bcirc.hold2{transform:scale(.72)}
.blab{font:800 1.3rem var(--round);color:var(--lagoon)}
.bcnt{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.breath .seg{justify-content:center}
@media (prefers-reduced-motion:reduce){.bcirc{transition:none}}
.listen{align-self:flex-start;border:1px solid var(--lagoon);background:var(--surface);color:var(--lagoon);font-weight:700;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.9rem}
.listen:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
.hero .listen{background:transparent;color:var(--lagoon-ink);border-color:var(--lagoon-ink)}
#ttsbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 8px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 24px)}

#ttsbar .ti{font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 4px}

.texte.pausetxt{display:block}
.pausetxt .pz{color:var(--lagoon);font-weight:800}
.pausetxt .pz2{color:var(--ko)}
.jm summary{display:flex;flex-direction:column;gap:2px}
.jrole{font:500 .85rem var(--font);color:var(--muted)}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.qa .r{white-space:pre-line}
.card.menu{gap:0;padding:6px 6px 8px}
.mtitle{font:700 1.02rem var(--round);padding:10px 10px 6px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 10px 12px 14px;cursor:pointer;position:relative;min-height:54px}
.mrow::before{content:"";position:absolute;left:2px;top:14px;bottom:14px;width:4px;border-radius:4px;background:var(--c,var(--line))}
.mrow>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.mrow b{font:650 1rem/1.25 var(--round)}
.mrow small{color:var(--muted);font-size:.8rem}
.mbadge{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;flex:0 0 auto}
.mrow:focus-visible{outline:3px solid var(--lagoon);outline-offset:-3px;border-radius:12px}

.q.big{font-size:1.35rem}
.ans{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:14px;padding:12px 14px}
.ans p{margin:0;white-space:pre-line}
.answer,.ex{white-space:pre-line}
.fiche h4{margin:6px 0 0;font:700 .98rem var(--round)}
.fiche p{margin:0}
.fiche ul,.fiche ol{margin:0;padding-left:20px}
.card.quote{gap:6px;border-left:4px solid var(--lagoon)}
.quote .qt{margin:0;font:italic 600 1.08rem/1.4 Georgia,serif}
.quote .qa2{margin:0;font-size:.82rem;color:var(--muted)}
.quote .qx{margin:0;font-size:.95rem}

const todayK=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };

  if(!ev) return null; const n=Math.round((ev[0]-t0)/864e5); const c=el('div','card cd'); c.append(el('span','label','Prochain oral dans'), el('div','big',n===0?'Aujourd’hui':(n+(n>1?' jours':' jour'))), el('p','hint',ev[1])); return c;

function ficheBlocks(k){
  const out=[];
  (FICHES[k]||[]).forEach(f=>{
    const c=el('div','card fiche'); c.append(el('span','label',f.kind), el('h2',null,f.titre));
    if(f.src) c.append(el('p','src2',f.src));
    if(f.txt){ const b=el('div','texte'); f.txt.forEach(t=>b.append(el('p',null,t))); c.append(b); }
    f.secs.forEach(([h,p])=>{ if(h) c.append(el('h4',null,h)); if(p) c.append(el('p',null,p)); });
    out.push(c);
  });
  if(k==='act'&&RHP){ const c=el('div','card fiche'); c.append(el('span','label','Fiche Rhetorik'), el('h2',null,RHP.t)); RHP.blocks.forEach(b=>{ if(b.h) c.append(el('h4',null,b.h)); if(b.p) c.append(el('p',null,b.p)); if(b.ul){ const u=el('ul'); b.ul.forEach(x=>u.append(el('li',null,x))); c.append(u); } if(b.ol){ const u=el('ol'); b.ol.forEach(x=>u.append(el('li',null,x))); c.append(u); } if(b.table) b.table.forEach(([a,d])=>{ const r=el('p'); r.append(el('b',null,a+' : '), document.createTextNode(d)); c.append(r); }); }); out.push(c); }
  return out;
}
/* déverrouillage */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw){ const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(ENC.salt), iterations:250000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']); }
async function openWith(key){ const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, key, b64(ENC.ct)); const D=JSON.parse(new TextDecoder().decode(pt)); QS=D.qs; THEMES=D.themes; FICHES=D.fiches; DAYS=D.days; RHP=D.rhp; home(); }
function initLock(keyName){
  document.getElementById('lockform').addEventListener('submit', async ev=>{ ev.preventDefault(); const msg=document.getElementById('lockmsg'); msg.textContent='Vérification…';
    try{ const key=await deriveKey(document.getElementById('pw').value.trim()); await openWith(key); try{ const raw=await crypto.subtle.exportKey('raw',key); localStorage.setItem(keyName, btoa(String.fromCharCode(...new Uint8Array(raw)))); }catch(e){} }
    catch(e){ msg.textContent='Mot de passe incorrect.'; } });
  (async()=>{ try{ const k=localStorage.getItem(keyName); if(!k) return; const key=await crypto.subtle.importKey('raw', b64(k), {name:'AES-GCM'}, false, ['decrypt']); await openWith(key); } catch(e){ try{localStorage.removeItem(keyName)}catch(_){} } })();
  if('serviceWorker' in navigator){ window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
}

const TTS={q:[],i:0,on:false,paused:false,rate:1,tok:0};
function ttsOK(){ return 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window; }
function ttsVoice(){ const vs=speechSynthesis.getVoices()||[]; return vs.find(v=>/^fr[-_]FR/i.test(v.lang)&&/Am[ée]lie|Audrey|Aurélie|Marie|Thomas/i.test(v.name)) || vs.find(v=>/^fr[-_]FR/i.test(v.lang)) || vs.find(v=>/^fr/i.test(v.lang)) || null; }
function readable(node){
  const out=[];
  (function walk(n){
    if(n.nodeType===3){ const t=n.nodeValue.replace(/\s+/g,' ').trim(); if(t) out.push(t); return; }
    if(n.nodeType!==1) return;
    if(n.hidden || n.matches('.listen,.src,.foot,audio,svg,.archive,.top,.mic,.seg,.days,.tagc,.go,.box') ) return;
    if(n.tagName==='BUTTON' && !n.classList.contains('qa')) return;
    if(n.tagName==='DETAILS' && !n.open){ const s=n.querySelector('summary'); if(s) out.push(s.textContent.trim()+'.'); return; }
    n.childNodes.forEach(walk);
    if(/^(P|H1|H2|H3|H4|LI|DIV|SUMMARY|B|SPAN)$/.test(n.tagName)) out.push('\n');
  })(node);
  return out.join(' ');
}
function ttsChunks(text){
  const parts=text.replace(/[«»"]/g,'').split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const out=[]; parts.forEach(p=>{ (p.match(/[^.!?…]+[.!?…]*\s*/g)||[p]).forEach(s=>{ s=s.trim(); if(!s) return; if(s.length>220){ s.match(/.{1,200}(\s|$)/g).forEach(x=>out.push(x.trim())); } else out.push(s); }); });
  return out;
}
function ttsSay(){
  if(!TTS.on||TTS.paused) return;
  if(TTS.i>=TTS.q.length){ ttsStop(); return; }
  const tok=++TTS.tok; const u=new SpeechSynthesisUtterance(TTS.q[TTS.i]); u.lang='fr-FR'; const vo=ttsVoice(); if(vo) u.voice=vo; u.rate=TTS.rate;
  let started=false; u.onstart=()=>{ started=true; TTS.ok=true; };
  u.onend=()=>{ if(tok!==TTS.tok) return; TTS.i++; ttsSay(); };
  u.onerror=(e)=>{ if(tok!==TTS.tok) return; if(e&&(e.error==='interrupted'||e.error==='canceled')) return; TTS.err=(TTS.err||0)+1; if(TTS.err>2){ ttsStop(); ttsHelp(); return; } TTS.i++; ttsSay(); };
  try{ speechSynthesis.resume(); }catch(e){}
  speechSynthesis.speak(u); ttsBar();
  if(!TTS.ok) setTimeout(()=>{ if(tok===TTS.tok && !started && TTS.on && !TTS.paused){ ttsHelp(); } },2500);
}
function ttsPlay(text){
  if(!ttsOK()){ alert('La lecture à voix haute n’est pas disponible sur cet appareil.'); return; }
  const busy=speechSynthesis.speaking||speechSynthesis.pending;
  TTS.on=false; TTS.tok++; const ob=document.getElementById('ttsbar'); if(ob) ob.remove();
  TTS.q=ttsChunks(text); if(!TTS.q.length) return; TTS.i=0; TTS.on=true; TTS.paused=false; TTS.err=0;
  if(busy){ try{ speechSynthesis.cancel(); }catch(e){} setTimeout(ttsSay,120); } else ttsSay();
}
function ttsHelp(){

  const prev=el('button','tb','↺'); prev.type='button'; prev.setAttribute('aria-label','Phrase précédente'); prev.onclick=()=>{ TTS.i=Math.max(0,TTS.i-1); TTS.paused=false; TTS.tok++; speechSynthesis.cancel(); ttsSay(); };

function quoteCard(){

  const keys=Object.keys(QUOTES); const q=QUOTES[k]||QUOTES[k<keys[0]?keys[0]:keys[keys.length-1]]; if(!q) return null;

/* ---------- Mes connaissances (Sabrina) ---------- */
let P=store('sv_p',{});
const mastered=q=>(P[q.id]&&P[q.id].lv>=1);
const toReview=q=>{ const l=P[q.id]&&P[q.id].last; return l==='ko'||l==='mid'; };
function rec(q,v){ const p=P[q.id]||{lv:0,n:0}; p.n++; p.last=v===2?'ok':v===1?'mid':'ko'; p.lv=v===2?Math.min(3,p.lv+1):0; p.t=Date.now(); P[q.id]=p; put('sv_p',P); }
function dayChk(){ return store('sv_plan',{}); }
function dayDone(d){ const c=dayChk()[d.d]||{}; return d.steps.every((_,k)=>c[k]); }
function pickTheme(keys,n){ const pool=QS.filter(q=>keys.includes(q.th)); const rank=q=>{ const p=P[q.id]; if(!p) return 1; if(p.last!=='ok') return 0; return 2+p.lv; }; return shuffle(pool).sort((a,b)=>rank(a)-rank(b)).slice(0,n); }
let S=null;
function startDeck(deck, mode, back){ if(!deck.length){ alert('Aucune question à revoir pour l’instant. Bravo !'); return; } S={deck,mode,i:0,res:[],back:back||home}; render(); }
function render(){
  const v=document.getElementById('v-play'); v.replaceChildren(); show('v-play'); dock();
  if(S.i>=S.deck.length) return end(v);
  topbar(v, S.back, [100*S.i/S.deck.length, (S.i+1)+' / '+S.deck.length]);
  const q=S.deck[S.i]; const tg=el('span','tag',THEMES[q.th].n); tg.style.color=THCOL[q.th]; v.append(tg, el('p','q',q.q));
  if(S.mode==='qcm') qcm(v,q); else oral(v,q);
}
function oral(v,q){
  v.append(el('p','hint','Réfléchis, puis réponds à voix haute, avec tes mots, comme devant le jury. Ensuite seulement, affiche la réponse.'));
  dock(btn('main','Voir la réponse',()=>{
    const c=el('div','card'); c.append(el('span','label','La réponse'), el('p','answer',q.a), listenBtn('Écouter',q.a)); v.append(c);
    const r=el('div','evalrow'); r.append(btn('ko','Je ne savais pas',()=>{rec(q,0);S.res.push([q,0]);S.i++;render();}), btn('mid','À moitié',()=>{rec(q,1);S.res.push([q,1]);S.i++;render();}), btn('ok','Je savais',()=>{rec(q,2);S.res.push([q,2]);S.i++;render();})); dock(r);
    c.scrollIntoView({behavior:'smooth',block:'nearest'});
  }));
}
function qcm(v,q){
  const opts=shuffle([{t:q.ok,ok:true}].concat(q.ko.map(t=>({t,ok:false})))); const box=el('div','opts'); const bs=[];
  opts.forEach((o,k)=>{ const b=el('button','opt'); b.type='button'; b.append(el('span','k','ABCD'[k]), el('span',null,o.t)); b.onclick=()=>choose(o,b); bs.push([b,o]); box.append(b); }); v.append(box);
  function choose(o,b){ bs.forEach(([x,y])=>{ x.disabled=true; if(y.ok) x.classList.add('good'); else if(x===b) x.classList.add('bad'); else x.classList.add('dim'); });
    rec(q,o.ok?2:0); S.res.push([q,o.ok?2:0]); const vd=el('p','verdict '+(o.ok?'good':'bad'),o.ok?'Bonne réponse':'Pas tout à fait'); v.append(vd, el('p','ex',q.a), listenBtn('Écouter l’explication',q.a));
    dock(btn('main',S.i+1<S.deck.length?'Question suivante':'Voir mon résultat',()=>{S.i++;render();})); vd.scrollIntoView({behavior:'smooth',block:'nearest'}); }
}
function end(v){
  const ok=S.res.filter(r=>r[1]===2).length, n=S.res.length;
  const c=el('div','card'); c.append(el('span','label','Terminé'), el('div','score',ok+' / '+n), el('p',null, ok/n>=.8?'Excellent.':ok/n>=.5?'Bien : les erreurs reviendront en priorité.':'Chaque erreur d’aujourd’hui est une question de moins le jour J.')); v.append(c);
  const miss=S.res.filter(r=>r[1]<2); if(miss.length){ v.append(el('span','label','À retenir')); const L=el('div','list'); miss.forEach(([q])=>{ const m=el('div','miss'); m.append(el('p',null,q.q), el('p','hint','→ '+q.a)); L.append(m); }); v.append(L); }
  dock(btn('soft','Accueil',home), btn('main','Continuer',S.back));
}
function ficheView(k, back){
  const v=document.getElementById('v-play'); v.replaceChildren(); show('v-play'); topbar(v, back||home);
  v.append(el('h1',null,THEMES[k].n), el('p','sub','Ta fiche de révision : lis-la, ou écoute-la avec la liseuse.'));
  const blocks=ficheBlocks(k); if(!blocks.length) v.append(el('p','hint','Pas de fiche rédigée pour ce thème : révise directement avec les questions.'));
  else { const holder=el('div'); holder.style.display='contents'; blocks.forEach(b=>holder.append(b)); v.append(listenBtn('Écouter toute la fiche',()=>readable(holder)), holder); }

function themeView(k){
  const v=document.getElementById('v-play'); v.replaceChildren(); show('v-play'); topbar(v, home); dock(btn('soft','Accueil',home));
  const its=byTheme(k), m=its.filter(mastered).length, rv=its.filter(toReview).length;
  v.append(el('h1',null,THEMES[k].n), el('p','sub',its.length+' questions · '+m+' maîtrisées'+(rv?' · '+rv+' à revoir':'')));
  const c=el('div','card menu');
  c.append(menuRow('Ma fiche de révision','À lire ou à écouter', null, ()=>ficheView(k,()=>themeView(k)), THCOL[k]),
    menuRow('10 questions à voix haute','Tu réponds, puis tu compares', null, ()=>startDeck(pickTheme([k],10),'oral',()=>themeView(k)), THCOL[k]),
    menuRow('10 QCM','Pour vérifier vite', null, ()=>startDeck(pickTheme([k],10),'qcm',()=>themeView(k)), THCOL[k]),
    rv? menuRow('Mes erreurs sur ce thème', null, String(rv), ()=>startDeck(shuffle(its.filter(toReview)),'oral',()=>themeView(k)), 'var(--ko)','pill') : el('span'));
  v.append(c);
}
function stepGo(g, back){ if(g.k==='fiche') ficheView(g.th, back); else if(g.k==='oral') startDeck(pickTheme(g.th,g.n||10),'oral',back); else if(g.k==='qcm') startDeck(pickTheme(g.th,g.n||10),'qcm',back); else if(g.k==='rev') startDeck(shuffle(QS.filter(q=>toReview(q)&&(!g.th||g.th.includes(q.th)))).slice(0,15),'oral',back); else if(g.k==='revue') revue(back); }
let DV=null;
function dayView(i){
  if(i==null) i=DV!=null?DV:dayIdx(); DV=i; const d=DAYS[i], ti=dayIdx();
  const v=document.getElementById('v-play'); v.replaceChildren(); show('v-play'); topbar(v, ()=>{DV=null;home();});
  v.append(el('h1',null,'Mon programme'), el('p','sub','Un thème par jour, 20 minutes, jusqu’au 18 octobre'));
  const chips=el('div','days'); DAYS.forEach((x,k)=>{ const c=el('button','chip',(dayDone(x)?'✓ ':'')+dl(x.d,true)); c.type='button'; c.setAttribute('aria-pressed',k===i); if(k===ti) c.classList.add('today'); c.onclick=()=>dayView(k); chips.append(c); }); v.append(chips);
  setTimeout(()=>{ const s=chips.querySelector('[aria-pressed="true"]'); if(s) s.scrollIntoView({inline:'center',block:'nearest'}); },0);
  const hd=el('div','card'); hd.append(el('span','label','Jour '+(i+1)+' · '+dl(d.d)), el('h2','dtitle',d.t)); if(d.note) hd.append(el('p','hint',d.note)); v.append(hd);
  const cl=el('div','card'); cl.append(el('span','label', d.rest?'La journée':'Ta séance · coche au fur et à mesure')); const chk=dayChk()[d.d]||{};
  d.steps.forEach((s,k)=>{ const r=el('div','chk'+(chk[k]?' ok':'')); const b=el('button','box'); b.type='button'; b.setAttribute('role','checkbox'); b.setAttribute('aria-checked',!!chk[k]); b.setAttribute('aria-label',s.t); b.textContent=chk[k]?'✓':'';
    b.onclick=()=>{ const nv=b.getAttribute('aria-checked')!=='true'; b.setAttribute('aria-checked',nv); b.textContent=nv?'✓':''; r.classList.toggle('ok',nv); const c=dayChk(); c[d.d]=c[d.d]||{}; c[d.d][k]=nv; put('sv_plan',c); if(dayDone(d)) dayView(i); };
    r.append(b, el('span',null,s.t)); if(s.go){ const g=el('button','go','Lancer'); g.type='button'; g.onclick=()=>stepGo(s.go,()=>dayView(i)); r.append(g); } cl.append(r); });
  if(dayDone(d)) cl.append(el('p','verdict good','Séance terminée. Bravo !')); v.append(cl);
  dock(btn('soft','Accueil',()=>{DV=null;home();}), btn('main', i<DAYS.length-1?'Jour suivant':'Aujourd’hui', ()=>dayView(i<DAYS.length-1?i+1:ti)));
}
async function fetchJSON(u){ try{ const r=await fetch(u+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return null; return await r.json(); }catch(e){ return null; } }
async function revue(back,date){
  const v=document.getElementById('v-play'); v.replaceChildren(el('p','hint','Chargement…')); show('v-play'); dock(btn('soft','Retour',back||home));
  const ix=await fetchJSON('../revue/index.json')||[]; const d=date||ix[0]; const R=d?await fetchJSON('../revue/'+d+'.json'):null;

  if(!R){ v.append(el('p','hint','Pas encore de revue. Ouvre l’appli avec Internet.')); return; }
  try{ localStorage.setItem('sv_revue',d); }catch(e){}
  v.append(el('p','sub',R.titre), listenBtn('Écouter la revue',[R.titre].concat((R.items||[]).map(n=>n.titre+'.\n'+n.texte)).concat(R.question?['La question du jour.\n'+R.question.q+'\n'+R.question.r]:[]).join('\n')));
  const c=el('div','card'); (R.items||[]).forEach(n=>{ const a=el('div','news'); a.append(el('h3',null,n.titre), el('p',null,n.texte)); if(n.oral) a.append(el('p','oralnote','Pour l’oral : '+n.oral)); c.append(a); }); v.append(c);
  if(R.question){ const q=el('div','card'); q.append(el('span','label','La question du jour'), el('p','q',R.question.q)); const b=btn('main','Voir la réponse type',()=>b.replaceWith(el('p','answer',R.question.r))); q.append(b); v.append(q); }
}

  v.append(el('h1',null,'Mes connaissances'), el('p','sub','Le fond, pour les oraux des 20 et 22 octobre. L’oral se travaille avec Rhetorik.'));

  { const qc=quoteCard(); if(qc) v.append(qc); }

  const dp=el('div','card menu'); dp.append(el('span','mtitle','⚖️ Droit public'));

  v.append(dp, nc);
